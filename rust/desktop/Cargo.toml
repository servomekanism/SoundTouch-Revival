[package]
name = "soundtouch-radio-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
dirs = "6"
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "tokio", "x11", "wayland", "fira-sans"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
soundtouch-radio-core.workspace = true
tokio = { version = "1", features = ["rt"] }
